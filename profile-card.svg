      <rect x="498.0" y="125.0" width="84" height="30" rx="8" fill="#0E2340" stroke="#1B3A66" stroke-width="1.2"/><text x="540" y="144.3" fill="#F3D7C4">Client</text>
      <rect x="617.0" y="125.0" width="100" height="30" rx="8" fill="#14213A" stroke="#C9A227" stroke-width="1.2"/><text x="667" y="144.3" fill="#FFF3CC">Cloud Armor</text>
      <rect x="752.0" y="125.0" width="84" height="30" rx="8" fill="#0E2340" stroke="#2E6FD9" stroke-width="1.2"/><text x="794" y="144.3" fill="#F3D7C4">API</text>
      <rect x="752.0" y="211.0" width="84" height="30" rx="8" fill="#0E2340" stroke="#2E6FD9" stroke-width="1.2"/><text x="794" y="230.3" fill="#F3D7C4">Queue</text>
      <rect x="625.0" y="211.0" width="84" height="30" rx="8" fill="#0E2340" stroke="#2E6FD9" stroke-width="1.2"/><text x="667" y="230.3" fill="#F3D7C4">Worker</text>
      <rect x="498.0" y="211.0" width="84" height="30" rx="8" fill="#0E2340" stroke="#1B3A66" stroke-width="1.2"/><text x="540" y="230.3" fill="#F3D7C4">AI model</text>
      <rect x="498.0" y="297.0" width="84" height="30" rx="8" fill="#0E2340" stroke="#2E6FD9" stroke-width="1.2"/><text x="540" y="316.3" fill="#F3D7C4">Consumer</text>
      <rect x="625.0" y="297.0" width="84" height="30" rx="8" fill="#0E2340" stroke="#C9A227" stroke-width="1.2"/><text x="667" y="316.3" fill="#FFF3CC">Firestore</text>
