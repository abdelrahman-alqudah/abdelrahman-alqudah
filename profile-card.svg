    <g font-size="11.5" font-weight="600" fill="#F3D7C4" text-anchor="middle"><text x="115.5" y="267.5">ASP.NET Core</text><text x="210.5" y="267.5">Laravel</text><text x="273.5" y="267.5">Go</text><text x="109.0" y="301.5">PostgreSQL</text><text x="191.0" y="301.5">Redis</text><text x="266.5" y="301.5">Firebase</text><text x="106.0" y="335.5">Cloud Run</text><text x="188.0" y="335.5">Docker</text><text x="286.0" y="335.5">GitHub Actions</text></g>

