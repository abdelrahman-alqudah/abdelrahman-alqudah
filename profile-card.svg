    <g class="sans" font-size="11" font-style="italic" fill="#7F93B8">
      <text x="727" y="306">Gated at the edge,</text>
      <text x="727" y="321">then handled</text>
      <text x="727" y="336">asynchronously.</text>
    </g>

    <text x="668" y="399" class="sans" font-size="11" fill="#5E7699" text-anchor="middle">Simplified request path of U JO RESIDENT</text>
