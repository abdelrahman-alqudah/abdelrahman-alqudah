    <g fill="none" stroke-opacity=".8" stroke-width="1.4"><path id="p8" d="M794,80 L794,124.0" stroke="#C9A227" stroke-dasharray="3 4" marker-end="url(#arrowGold)"/></g>
    <circle r="4" fill="url(#nodeGlow)"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#p1"/></animateMotion></circle><circle r="4" fill="url(#nodeGlow)"><animateMotion dur="2.4s" begin="0.5s" repeatCount="indefinite"><mpath xlink:href="#p2"/></animateMotion></circle><circle r="4" fill="url(#nodeGlow)"><animateMotion dur="2.0s" begin="1.0s" repeatCount="indefinite"><mpath xlink:href="#p3"/></animateMotion></circle><circle r="4" fill="url(#nodeGlow)"><animateMotion dur="2.4s" begin="1.5s" repeatCount="indefinite"><mpath xlink:href="#p4"/></animateMotion></circle><circle r="4" fill="url(#nodeGlow)"><animateMotion dur="2.4s" begin="2.0s" repeatCount="indefinite"><mpath xlink:href="#p5"/></animateMotion></circle><circle r="4" fill="url(#nodeGlow)"><animateMotion dur="2.0s" begin="2.5s" repeatCount="indefinite"><mpath xlink:href="#p6"/></animateMotion></circle><circle r="4" fill="url(#nodeGlow)"><animateMotion dur="2.4s" begin="3.0s" repeatCount="indefinite"><mpath xlink:href="#p7"/></animateMotion></circle><circle r="3" fill="url(#goldGlow)"><animateMotion dur="1.8s" begin="0.3s" repeatCount="indefinite"><mpath xlink:href="#p8"/></animateMotion></circle>

