<svg viewBox="0 0 900 460" width="900" height="460" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Abd Elrahman Alqudah, Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Abd Elrahman Alqudah, Software Engineer</title>
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#060B18"/>
      <stop offset=".55" stop-color="#0E2340"/>
      <stop offset="1" stop-color="#050B14"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="900" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E6FD9"/>
      <stop offset=".5" stop-color="#123A66"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
    <linearGradient id="rule" x1="64" y1="0" x2="340" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9A227"/>
      <stop offset=".45" stop-color="#2E6FD9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#2E6FD9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#9CC8FF"/>
      <stop offset=".45" stop-color="#4FA3FF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#4FA3FF" stop-opacity="0"/>
