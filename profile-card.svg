    <rect x="663" y="124.0" width="8" height="6" rx="1.4" fill="#0A1526"/>
    <path d="M664.4,124.0 L664.4,121.8 C664.4,118.8 669.6,118.8 669.6,121.8 L669.6,124.0" stroke="#0A1526" stroke-width="1.5" fill="none"/>

